<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ça Coûte Combien?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#EEF0F2;
    --paper-raised:#FFFFFF;
    --ink:#1F2430;
    --ink-soft:#4B5165;
    --indigo:#2A3B73;
    --indigo-deep:#1C2A57;
    --red:#A6362B;
    --gold:#8A6A22;
    --green:#2E7D4F;
    --mist:#D7DCE3;
    --mist-strong:#BFC7D2;
    --shadow: 0 1px 2px rgba(31,36,48,.06), 0 8px 24px -12px rgba(31,36,48,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171F;
      --paper-raised:#1B1F2B;
      --ink:#E8E9EE;
      --ink-soft:#A9AEC0;
      --indigo:#8DA0E8;
      --indigo-deep:#B7C4F2;
      --red:#E58176;
      --gold:#E3B563;
      --green:#7FC494;
      --mist:#313749;
      --mist-strong:#3D465C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171F;
    --paper-raised:#1B1F2B;
    --ink:#E8E9EE;
    --ink-soft:#A9AEC0;
    --indigo:#8DA0E8;
    --indigo-deep:#B7C4F2;
    --red:#E58176;
    --gold:#E3B563;
    --green:#7FC494;
    --mist:#313749;
    --mist-strong:#3D465C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, 'Times New Roman', serif;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  ::selection{ background:var(--indigo); color:var(--paper-raised); }
  a{ color:inherit; }
  button{ font-family:inherit; }

  .app{ max-width:1180px; margin:0 auto; padding:20px clamp(14px,3vw,32px) 60px; }

  .topbar{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; padding-bottom:16px; }
  .brand-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 6px; }
  .brand-title{ font-size:clamp(26px,3.4vw,38px); font-weight:600; letter-spacing:-.01em; color:var(--indigo); }
  .brand-sub{ font-size:14px; color:var(--ink-soft); margin-top:6px; max-width:54ch; }

  button:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--indigo); outline-offset:2px; }

  .flag-rule{ height:3px; border-radius:2px; background: linear-gradient(90deg, var(--indigo) 0 32%, var(--mist) 32% 68%, var(--red) 68% 100%); margin:2px 0 22px; }

  .progress-track{ height:6px; border-radius:4px; background:var(--mist); overflow:hidden; margin-bottom:26px; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--indigo), var(--red)); transition:width .4s ease; }
  @media (prefers-reduced-motion: reduce){ .progress-fill{ transition:none; } }

  .layout{ display:grid; grid-template-columns: 250px 1fr; gap:24px; align-items:start; }
  .rail{ display:flex; flex-direction:column; gap:6px; position:sticky; top:16px; }
  .rail-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; border:1px solid transparent; background:transparent; cursor:pointer; text-align:left; color:var(--ink-soft); }
  .rail-item:hover{ background:var(--paper-raised); border-color:var(--mist); }
  .rail-item.active{ background:var(--paper-raised); border-color:var(--mist-strong); box-shadow:var(--shadow); color:var(--ink); }
  .rail-num{ font-family:'IBM Plex Mono', monospace; font-size:11px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--mist); color:var(--ink-soft); flex:0 0 auto; }
  .rail-item.active .rail-num{ background:var(--indigo); color:var(--paper-raised); }
  .rail-item.done .rail-num{ background:var(--indigo-deep); color:var(--paper-raised); }
  .rail-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .rail-title{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rail-time{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); }

  @media (max-width: 860px){
    .layout{ grid-template-columns:1fr; }
    .rail{ order:2; display:flex; flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:6px; position:static; }
    .rail-item{ min-width:168px; flex:0 0 auto; }
    .stage{ order:1; }
  }

  .stage{ background:var(--paper-raised); border:1px solid var(--mist); border-radius:14px; box-shadow:var(--shadow); padding:clamp(20px,3.4vw,40px); min-height:480px; }
  .kicker{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.06em; color:var(--red); margin-bottom:8px; }
  .badge-time{ display:inline-block; margin-left:10px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); border:1px solid var(--mist-strong); border-radius:999px; padding:1px 9px; }
  .stage h2{ font-size:clamp(24px,3vw,34px); color:var(--ink); line-height:1.15; }
  .stage-lede{ margin-top:12px; color:var(--ink-soft); font-size:15.5px; line-height:1.6; max-width:72ch; }
  .section-block{ margin-top:28px; }
  .section-label{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:10px; font-weight:600; }

  /* chips */
  .chip-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip{ display:inline-flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--mist-strong); border-radius:999px; padding:8px 14px 8px 10px; cursor:pointer; color:var(--ink); }
  .chip:hover{ border-color:var(--indigo); }
  .chip:active{ transform:translateY(1px); }
  .chip-icon{ width:22px; height:22px; border-radius:50%; background:var(--indigo); color:var(--paper-raised); display:grid; place-items:center; flex:0 0 auto; }
  .chip-word{ font-weight:600; font-size:14.5px; }
  .chip-ipa{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft); }

  /* number tiles */
  .num-row{ display:flex; flex-wrap:wrap; gap:12px; }
  .num-tile{ background:var(--paper); border:1px solid var(--mist); border-radius:12px; padding:12px 14px; min-width:120px; text-align:center; cursor:pointer; }
  .num-tile:hover{ border-color:var(--indigo); }
  .num-tile .digit{ font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; color:var(--indigo); }
  .num-tile .word{ font-size:13.5px; margin-top:4px; font-weight:600; }
  .num-tile .play-hint{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }

  .callout{ border-left:3px solid var(--gold); background:var(--paper); padding:12px 16px; border-radius:0 8px 8px 0; font-size:14px; color:var(--ink-soft); line-height:1.55; }
  .callout strong{ color:var(--ink); }

  /* vocab */
  .vocab-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
  .vocab-item{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:8px 4px; border-bottom:1px dashed var(--mist-strong); }
  .vocab-fr{ font-weight:600; font-size:14.5px; }
  .vocab-en{ color:var(--ink-soft); font-size:13.5px; text-align:right; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  @media (max-width:700px){ .two-col{ grid-template-columns:1fr; } }

  /* product wall */
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  .product-card{ background:var(--paper); border:1px solid var(--mist); border-radius:14px; padding:16px; cursor:pointer; text-align:center; transition:border-color .12s ease; }
  .product-card:hover{ border-color:var(--indigo); }
  .product-name{ font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; }
  .product-price{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--red); margin-top:8px; }
  .product-price .cur{ font-size:13px; color:var(--ink-soft); }
  .product-word{ font-size:12px; color:var(--ink-soft); margin-top:6px; min-height:16px; }
  .product-hint{ font-size:10.5px; color:var(--ink-soft); margin-top:8px; }

  /* quiz */
  .quiz-card{ border:1px solid var(--mist); border-radius:10px; padding:16px; background:var(--paper); margin-top:12px; }
  .quiz-q{ font-weight:600; margin-bottom:10px; font-size:14.5px; }
  .quiz-opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .quiz-opt{ border:1px solid var(--mist-strong); background:var(--paper-raised); color:var(--ink); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:14px; }
  .quiz-opt:hover{ border-color:var(--indigo); }
  .quiz-opt.correct{ background:var(--green); border-color:var(--green); color:#fff; }
  .quiz-opt.wrong{ background:var(--red); border-color:var(--red); color:#fff; }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-feedback{ margin-top:8px; font-size:13px; color:var(--ink-soft); min-height:16px; }
  .listen-line{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--mist-strong); border-radius:999px; padding:6px 14px 6px 8px; cursor:pointer; margin-top:10px; font-size:13.5px; background:var(--paper-raised); }
  .listen-line:hover{ border-color:var(--indigo); }

  .passage{ font-family:'Fraunces', serif; font-size:18px; line-height:1.9; color:var(--ink); background:var(--paper); border:1px solid var(--mist); border-radius:10px; padding:20px 22px; }
  .dialogue-line{ display:flex; gap:10px; margin:6px 0; }
  .dialogue-role{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); min-width:64px; padding-top:3px; }

  .stage-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:18px; border-top:1px solid var(--mist); }
  .nav-btn{ display:inline-flex; align-items:center; gap:8px; background:var(--indigo); color:var(--paper-raised); border:none; border-radius:8px; padding:11px 18px; font-weight:600; font-size:14px; cursor:pointer; }
  .nav-btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--mist-strong); }
  .nav-btn:disabled{ opacity:.35; cursor:default; }
  .nav-btn:hover:not(:disabled){ background:var(--indigo-deep); }
  .nav-btn.ghost:hover:not(:disabled){ border-color:var(--indigo); color:var(--indigo); }

  .score-pill{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); border:1px solid var(--mist-strong); border-radius:999px; padding:4px 12px; white-space:nowrap; }

  .obj-list{ margin:14px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  .obj-list li{ display:flex; gap:10px; font-size:14.5px; color:var(--ink); align-items:flex-start; }
  .obj-list li::before{ content:"«" attr(data-n) "»"; font-family:'IBM Plex Mono',monospace; color:var(--red); font-size:12px; flex:0 0 auto; margin-top:3px; }

  .final-score{ display:flex; align-items:baseline; gap:10px; font-family:'IBM Plex Mono', monospace; }
  .final-score .num{ font-size:40px; font-weight:600; color:var(--indigo); }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <p class="brand-eyebrow">A1 · French Numbers &amp; Shopping</p>
      <h1 class="brand-title">Ça Coûte Combien?</h1>
      <p class="brand-sub">Counting from 20 to 1000 through a trip to the French supermarket — taught by Karla, in English.</p>
    </div>
  </div>
  <div class="flag-rule"></div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="Lesson stops"></nav>
    <main class="stage" id="stage"></main>
  </div>
</div>

<script>
(function(){

  /* ---------------- Speech ---------------- */
  var frVoice = null;
  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    var voices = window.speechSynthesis.getVoices();
    frVoice = voices.find(function(v){ return v.lang === 'fr-FR'; }) ||
              voices.find(function(v){ return v.lang && v.lang.indexOf('fr') === 0; }) || null;
  }
  if('speechSynthesis' in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function speak(text){
    if(!('speechSynthesis' in window)){
      alert('Text-to-speech is not available in this browser. Try Chrome or Edge.');
      return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    if(frVoice) u.voice = frVoice;
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
  window.speak = speak;

  function esc(s){ return s.replace(/'/g,"\\'"); }

  function speakerSvg(){
    return '<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M1 4.5H3L6 2V10L3 7.5H1V4.5Z" fill="currentColor"/><path d="M8 4.2C8.6 4.7 9 5.3 9 6C9 6.7 8.6 7.3 8 7.8" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>';
  }

  function chip(word, ipa){
    return '<button class="chip" onclick="speak(\''+esc(word)+'\')" title="Play pronunciation">' +
      '<span class="chip-icon">'+speakerSvg()+'</span>' +
      '<span class="chip-word">'+word+'</span>' +
      (ipa ? '<span class="chip-ipa">['+ipa+']</span>' : '') +
      '</button>';
  }

  function numTile(digit, word){
    return '<div class="num-tile" onclick="speak(\''+esc(word)+'\')">' +
      '<div class="digit">'+digit+'</div>' +
      '<div class="word">'+word+'</div>' +
      '<div class="play-hint">'+speakerSvg()+' tap to hear</div>' +
      '</div>';
  }

  function vocabList(pairs){
    return '<ul class="vocab-list">' + pairs.map(function(p){
      return '<li class="vocab-item"><span class="vocab-fr">'+chip(p[0])+'</span><span class="vocab-en">'+p[1]+'</span></li>';
    }).join('') + '</ul>';
  }

  function productCard(name, price, word){
    var id = 'pc'+(Math.random()+'').slice(2,9);
    var full = name + ' coûte ' + word + ' euros.';
    return '<div class="product-card" onclick="speak(\''+esc(full)+'\'); document.getElementById(\''+id+'\').textContent=\''+esc(word)+'\';">' +
      '<div class="product-name">'+name+'</div>' +
      '<div class="product-price">'+price+'<span class="cur"> €</span></div>' +
      '<div class="product-word" id="'+id+'"></div>' +
      '<div class="product-hint">'+speakerSvg()+' tap to hear the price</div>' +
      '</div>';
  }

  var qCounter = 0;
  var score = { correct:0, answered:0 };
  function quiz(question, options, correctIndex, opts){
    opts = opts || {};
    var qid = 'q'+(qCounter++);
    var optsHtml = options.map(function(opt,i){
      return '<button class="quiz-opt" data-qid="'+qid+'" data-correct="'+(i===correctIndex)+'" onclick="answerQuiz(this)">'+opt+'</button>';
    }).join('');
    var audioBtn = opts.audio ?
      '<span class="listen-line" onclick="speak(\''+esc(opts.audio)+'\')">'+speakerSvg()+' Listen</span><br>' : '';
    return '<div class="quiz-card" id="'+qid+'-wrap">' +
      audioBtn +
      '<div class="quiz-q">'+question+'</div>' +
      '<div class="quiz-opts" id="'+qid+'">'+optsHtml+'</div>' +
      '<div class="quiz-feedback" id="'+qid+'-fb"></div>' +
      '</div>';
  }
  window.answerQuiz = function(btn){
    var group = btn.parentElement;
    if(group.dataset.answered) return;
    group.dataset.answered = '1';
    var isCorrect = btn.dataset.correct === 'true';
    Array.prototype.forEach.call(group.children, function(b){
      b.disabled = true;
      if(b.dataset.correct === 'true') b.classList.add('correct');
    });
    if(!isCorrect) btn.classList.add('wrong');
    var fb = document.getElementById(group.id+'-fb');
    fb.textContent = isCorrect ? 'Correct!' : 'Not quite — the right answer is highlighted in green.';
    score.answered++;
    if(isCorrect) score.correct++;
    updateScorePill();
  };
  function updateScorePill(){
    var el = document.getElementById('scorePill');
    if(el) el.textContent = 'Practice score: ' + score.correct + '/' + score.answered;
    var fs = document.getElementById('finalScoreNum');
    if(fs) fs.textContent = score.correct + '/' + score.answered;
  }

  /* ---------------- Content data ---------------- */
  var S = [];

  // 0 — Welcome
  S.push({
    tag:'Welcome', minutes:3, kicker:'ORIENTATION',
    title:'How much does that cost?',
    lede:'Today we\'re going shopping. French numbers get delightfully weird after 60 — by the end of this lesson you\'ll be able to count from 20 to 1000, and actually use those numbers to talk about prices in a French supermarket.',
    body:function(){
      return '<div class="section-block">'+
        '<div class="section-label">Today\'s stops</div>'+
        '<ul class="obj-list">'+
          '<li data-n="1">Build any number from 20&ndash;69 with a tens word plus «et un» or a hyphen.</li>'+
          '<li data-n="2">Crack the trickiest range in French counting: 70&ndash;99, built entirely from 60 and 80.</li>'+
          '<li data-n="3">Count in hundreds all the way up to «mille» (1000).</li>'+
          '<li data-n="4">Shop at a French supermarket: ask and answer &laquo;&nbsp;Ça coûte combien&nbsp;?&nbsp;&raquo;</li>'+
        '</ul>'+
        '</div>'+
        '<div class="callout" style="margin-top:22px;">Click any number or word throughout this lesson to hear it spoken aloud.</div>';
    }
  });

  // 1 — 20-69
  S.push({
    tag:'Stop 1', minutes:7, kicker:'NUMBERS 20&ndash;69',
    title:'Twenty, thirty, forty&hellip; and their in-betweens',
    lede:'From 20 to 69, French numbers follow one tidy rule: a tens word, then the unit. Add a hyphen for most units — but for «un» (one), use «et» instead, with no hyphen at all.',
    body:function(){
      return '<div class="section-block"><div class="section-label">The five tens words</div><div class="num-row">'+
        numTile(20,'vingt')+numTile(30,'trente')+numTile(40,'quarante')+numTile(50,'cinquante')+numTile(60,'soixante')+
        '</div></div>'+
        '<div class="section-block"><div class="section-label">+1 &rarr; tens word + «et un» (no hyphen)</div><div class="num-row">'+
        numTile(21,'vingt et un')+numTile(31,'trente et un')+numTile(41,'quarante et un')+numTile(51,'cinquante et un')+numTile(61,'soixante et un')+
        '</div></div>'+
        '<div class="section-block"><div class="section-label">Everything else &rarr; tens word + hyphen + unit</div><div class="num-row">'+
        numTile(22,'vingt-deux')+numTile(34,'trente-quatre')+numTile(48,'quarante-huit')+numTile(56,'cinquante-six')+numTile(69,'soixante-neuf')+
        '</div></div>'+
        '<div class="callout">Notice: only «un» gets the special «et» treatment. Every other unit (deux, trois, quatre&hellip;) just gets a hyphen.</div>'+
        '<div class="section-block">'+
        quiz('How do you say 34?', ['trente-et-quatre','trente-quatre','quatre-trente'], 1, {audio:'trente-quatre'})+
        quiz('Which number is "cinquante et un"?', ['15','50','51'], 2, {audio:'cinquante et un'})+
        '</div>';
    }
  });

  // 2 — 70-99
  S.push({
    tag:'Stop 2', minutes:7, kicker:'NUMBERS 70&ndash;99',
    title:'Where French counting gets creative',
    lede:'French has no separate word for seventy, eighty, or ninety. Instead, it keeps building on «soixante» (60) and «vingt» (20): 70 is literally "sixty-ten", 80 is "four-twenties", and 90 is "four-twenty-ten".',
    body:function(){
      return '<div class="section-block"><div class="section-label">70&ndash;79 &middot; "soixante" + 10 through 19</div><div class="num-row">'+
        numTile(70,'soixante-dix')+numTile(71,'soixante et onze')+numTile(72,'soixante-douze')+numTile(75,'soixante-quinze')+numTile(79,'soixante-dix-neuf')+
        '</div></div>'+
        '<div class="section-block"><div class="section-label">80&ndash;89 &middot; "quatre-vingts" + units</div><div class="num-row">'+
        numTile(80,'quatre-vingts')+numTile(81,'quatre-vingt-un')+numTile(82,'quatre-vingt-deux')+numTile(85,'quatre-vingt-cinq')+numTile(89,'quatre-vingt-neuf')+
        '</div></div>'+
        '<div class="section-block"><div class="section-label">90&ndash;99 &middot; "quatre-vingt" + 10 through 19</div><div class="num-row">'+
        numTile(90,'quatre-vingt-dix')+numTile(91,'quatre-vingt-onze')+numTile(92,'quatre-vingt-douze')+numTile(96,'quatre-vingt-seize')+numTile(99,'quatre-vingt-dix-neuf')+
        '</div></div>'+
        '<div class="callout"><strong>Watch out:</strong> 81 and 91 break the «et un» pattern you just learned! It\'s <span class="mono">quatre-vingt-un</span>, not "quatre-vingt-et-un" — no «et» in the 80s or 90s.</div>'+
        '<div class="section-block">'+
        quiz('71 is built the same way as which other number in this lesson?', ['21 (vingt et un)','80 (quatre-vingts)','100 (cent)'], 0, {audio:'soixante et onze'})+
        quiz('How do you say 96?', ['quatre-vingt-seize','soixante-seize','quatre-vingt-dix-six'], 0, {audio:'quatre-vingt-seize'})+
        quiz('Which number is "quatre-vingt-un"?', ['21','41','81'], 2, {audio:'quatre-vingt-un'})+
        '</div>';
    }
  });

  // 3 — 100-1000
  S.push({
    tag:'Stop 3', minutes:6, kicker:'NUMBERS 100&ndash;1000',
    title:'Counting by hundreds all the way to mille',
    lede:'Good news: hundreds are simple. Just say the number of hundreds, then «cent(s)» — and «mille» (1000) never changes form, no matter how many thousands you have.',
    body:function(){
      return '<div class="section-block"><div class="num-row">'+
        numTile(100,'cent')+numTile(200,'deux-cents')+numTile(300,'trois-cents')+numTile(400,'quatre-cents')+numTile(500,'cinq-cents')+
        '</div></div>'+
        '<div class="section-block"><div class="num-row">'+
        numTile(600,'six-cents')+numTile(700,'sept-cents')+numTile(800,'huit-cents')+numTile(900,'neuf-cents')+numTile(1000,'mille')+
        '</div></div>'+
        '<div class="callout">Bonus fact: «mille» is invariable — it never takes an «s», even for two mille, ten mille, or a hundred mille.</div>'+
        '<div class="section-block">'+
        quiz('How do you say 700?', ['sept-cents','sept-mille','cent-sept'], 0, {audio:'sept-cents'})+
        quiz('Which is correct for 1000?', ['milles','mille','un mille'], 1, {audio:'mille'})+
        '</div>';
    }
  });

  // 4 — Vocabulary
  S.push({
    tag:'Stop 4', minutes:4, kicker:'VOCABULARY &middot; SHOPPING',
    title:'The words you\'ll need to shop',
    lede:'A handful of shopping words to go along with our numbers.',
    body:function(){
      return '<div class="section-block two-col">'+
          '<div>'+vocabList([['trop','too much'],['beaucoup','many, a lot'],['très','very'],['cher (m) / chère (f)','expensive']])+'</div>'+
          '<div>'+vocabList([['économique','cheap'],['coûter','to cost'],['en espèces','in cash'],['le paiement','payment'],['l’argent','money']])+'</div>'+
        '</div>';
    }
  });

  // 5 — Supermarket price wall
  var PRODUCTS = [
    ['La brosse à dents', 30, 'trente'],
    ['Le savon', 40, 'quarante'],
    ['Le shampoing', 50, 'cinquante'],
    ['Le pain', 60, 'soixante'],
    ['Le lait', 70, 'soixante-dix'],
    ['La pomme', 80, 'quatre-vingts'],
    ['Le poulet', 90, 'quatre-vingt-dix'],
    ['Le jus d’orange', 100, 'cent']
  ];
  S.push({
    tag:'Stop 5', minutes:7, kicker:'BIENVENUE AU SUPERMARCHÉ',
    title:'Welcome to the supermarket',
    lede:'Walk down the aisle — click each product to hear how much it costs, in a full French sentence.',
    body:function(){
      return '<div class="section-block"><div class="product-grid">'+
        PRODUCTS.map(function(p){ return productCard(p[0], p[1], p[2]); }).join('') +
        '</div></div>'+
        '<div class="callout">Every price in this store is a round multiple of ten — perfect practice for the tens words from Stops 1&ndash;3.</div>'+
        '<div class="section-block">'+
        quiz('"Le pain coûte soixante euros." How much does the bread cost?', ['50 €','60 €','70 €'], 1, {audio:'Le pain coûte soixante euros.'})+
        '</div>';
    }
  });

  // 6 — Practice: shopping totals
  S.push({
    tag:'Stop 6', minutes:6, kicker:'PRACTICE &middot; DO THE MATH',
    title:'Add up your shopping list',
    lede:'Now put your numbers to work. Add up each shopping list, then pick the French word for the total.',
    body:function(){
      return '<div class="section-block">'+
        '<div class="callout">Le pain (60) + le lait (70) = ? Add them up before you answer.</div>'+
        quiz('Le pain (60 €) + le lait (70 €) = ?', ['cent trente','cent quarante','cent dix'], 0, {audio:'cent trente'})+
        quiz('La pomme (80 €) + le savon (40 €) = ?', ['cent dix','cent vingt','cent trente'], 1, {audio:'cent vingt'})+
        quiz('Le poulet (90 €) + le jus d\'orange (100 €) = ?', ['cent quatre-vingt-dix','deux-cents','cent quatre-vingts'], 0, {audio:'cent quatre-vingt-dix'})+
        '</div>'+
        '<div class="section-block">'+
        '<div class="section-label">Mixed review</div>'+
        quiz('Which number is "quatre-vingt-quinze"?', ['85','95','75'], 1)+
        quiz('Which number is "sept-cents"?', ['70','700','7000'], 1)+
        '</div>';
    }
  });

  // 7 — Dialogue read aloud
  S.push({
    tag:'Stop 7', minutes:6, kicker:'READ ALOUD &middot; AT THE CHECKOUT',
    title:'Au supermarché — a checkout dialogue',
    lede:'Read this dialogue aloud in pairs — one of you is the customer, one is the cashier. Listen once first, then act it out.',
    body:function(){
      return '<div class="section-block">'+
        '<div class="passage">'+
          '<div class="dialogue-line"><span class="dialogue-role">CLIENT</span><span>Bonjour&nbsp;! Je voudrais du pain et du savon, s’il vous plaît.</span></div>'+
          '<div class="dialogue-line"><span class="dialogue-role">CAISSIÈRE</span><span>Bien sûr. Le pain coûte soixante euros et le savon coûte quarante euros.</span></div>'+
          '<div class="dialogue-line"><span class="dialogue-role">CLIENT</span><span>Ça coûte combien au total&nbsp;?</span></div>'+
          '<div class="dialogue-line"><span class="dialogue-role">CAISSIÈRE</span><span>Ça coûte cent euros.</span></div>'+
          '<div class="dialogue-line"><span class="dialogue-role">CLIENT</span><span>Est-ce que je peux payer en espèces&nbsp;?</span></div>'+
          '<div class="dialogue-line"><span class="dialogue-role">CAISSIÈRE</span><span>Oui, bien sûr&nbsp;!</span></div>'+
          '<div class="listen-line" onclick="speak(\'Bonjour ! Je voudrais du pain et du savon, s\\\'il vous plaît. Bien sûr. Le pain coûte soixante euros et le savon coûte quarante euros. Ça coûte combien au total ? Ça coûte cent euros. Est-ce que je peux payer en espèces ? Oui, bien sûr !\')">'+speakerSvg()+' Listen to the full dialogue</div>'+
        '</div>'+
        '</div>'+
        '<div class="section-block">'+
        quiz('In the dialogue, how much does the soap (le savon) cost?', ['30 €','40 €','50 €'], 1)+
        quiz('How does the customer ask "can I pay in cash?"', ['Ça coûte combien ?','Est-ce que je peux payer en espèces ?','Je voudrais du pain.'], 1)+
        '</div>';
    }
  });

  // 8 — wrap up
  S.push({
    tag:'Stop 8', minutes:4, kicker:'WRAP-UP',
    title:'One last count before we go',
    lede:'A final mixed round covering everything from today.',
    body:function(){
      return '<div class="section-block">'+
        quiz('How do you say 45?', ['quarante-cinq','cinquante-quatre','quatre-cinq'], 0, {audio:'quarante-cinq'})+
        quiz('How do you say 91?', ['quatre-vingt-onze','quatre-vingt-un','soixante et onze'], 0, {audio:'quatre-vingt-onze'})+
        quiz('How do you say 700?', ['sept-mille','sept-cents','soixante-dix'], 1, {audio:'sept-cents'})+
        '</div>'+
        '<div class="section-block" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">'+
        '<div class="final-score"><span class="num" id="finalScoreNum">0/0</span><span style="color:var(--ink-soft); font-size:13px;">practice questions correct today</span></div>'+
        '</div>'+
        '<div class="section-block callout" style="border-color:var(--indigo); border-left-color:var(--indigo);">'+
        '<strong style="color:var(--indigo); font-family:\'Fraunces\',serif; font-size:16px;">Keep practicing</strong><br>'+
        'These same numbers — 20 through 99 — are exactly what you\'ll need for listening and dictation practice. The more comfortable "quatre-vingt-douze" feels, the faster your ear will catch it.'+
        '</div>';
    }
  });

  /* ---------------- Render ---------------- */
  var current = 0;
  var rail = document.getElementById('rail');
  var stage = document.getElementById('stage');
  var cum = [];
  (function(){ var t=0; S.forEach(function(s){ cum.push(t); t+=s.minutes; }); })();

  function mm(n){ return (n<10?'0':'')+n+':00'; }

  function renderRail(){
    rail.innerHTML = S.map(function(s,i){
      var cls = 'rail-item' + (i===current?' active':'') + (i<current?' done':'');
      return '<button class="'+cls+'" onclick="goTo('+i+')">'+
        '<span class="rail-num">'+(i+1)+'</span>'+
        '<span class="rail-text"><span class="rail-title">'+s.kicker.replace(/«|»/g,'')+'</span>'+
        '<span class="rail-time">'+mm(cum[i])+'&ndash;'+mm(cum[i]+s.minutes)+'</span></span>'+
        '</button>';
    }).join('');
  }

  function renderStage(){
    var s = S[current];
    stage.innerHTML =
      '<div class="kicker">'+s.tag.toUpperCase()+' &nbsp;·&nbsp; '+s.kicker+'<span class="badge-time">'+s.minutes+' min</span></div>'+
      '<h2>'+s.title+'</h2>'+
      '<p class="stage-lede">'+s.lede+'</p>'+
      s.body()+
      '<div class="stage-nav">'+
        '<button class="nav-btn ghost" onclick="goTo('+(current-1)+')" '+(current===0?'disabled':'')+'>&larr; Back</button>'+
        '<span class="score-pill" id="scorePill">Practice score: '+score.correct+'/'+score.answered+'</span>'+
        (current===S.length-1 ?
          '<button class="nav-btn" onclick="goTo(0)">Restart lesson &#8635;</button>' :
          '<button class="nav-btn" onclick="goTo('+(current+1)+')">Next stop &rarr;</button>')+
      '</div>';
    var fs = document.getElementById('finalScoreNum');
    if(fs) fs.textContent = score.correct+'/'+score.answered;
    var fillEl = document.getElementById('progressFill');
    if(fillEl) fillEl.style.width = (((current+1)/S.length)*100)+'%';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  window.goTo = function(i){
    if(i<0 || i>=S.length) return;
    current = i;
    renderRail();
    renderStage();
  };

  renderRail();
  renderStage();

})();
</script>

</body></html>
