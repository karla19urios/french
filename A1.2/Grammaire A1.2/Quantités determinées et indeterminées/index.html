<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantités déterminées et indéterminées — Français A1.2</title>
<style>
  :root{ --bleu:#002395; --blanc:#ffffff; --rouge:#ED2939; --bg:#f4f5f7; --card:#ffffff; --text:#1a1a2e; --muted:#6b7280; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#12141c; --card:#1b1e2b; --text:#f1f2f6; --muted:#9aa0b4; --border:#2a2e40; } }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header.flag{ background:linear-gradient(90deg, var(--bleu) 33%, var(--blanc) 33%, var(--blanc) 66%, var(--rouge) 66%); height:8px; width:100%; }
  .hero{ padding:1.6rem 1.5rem 1rem; text-align:center; }
  .hero h1{ margin:0 0 .3rem; font-size:1.6rem; letter-spacing:-0.02em; }
  main{ max-width:800px; margin:0 auto; padding:0 1.5rem 3rem; }
  .gallery{ display:flex; flex-direction:column; gap:1.2rem; }
  .gallery img{ width:100%; border-radius:12px; border:1px solid var(--border); }
  .back{ display:block; text-align:center; margin:1.5rem 0; font-size:.85rem; color:var(--muted); text-decoration:none; }
  .back:hover{ color:var(--bleu); }
</style>
</head>
<body>
<header class="flag"></header>
<div class="hero">
  <h1>Quantités déterminées et indéterminées</h1>
</div>
<main>
  <div class="gallery">
    <img src="1_1_QI.png" alt="Quantités indéterminées — page 1">
    <img src="1_2_QI.png" alt="Quantités indéterminées — page 2">
    <img src="2_1_QD.png" alt="Quantités déterminées — page 1">
    <img src="2_QD.png" alt="Quantités déterminées — page 2">
  </div>
  <a class="back" href="../../grammaire.html">← Retour à la grammaire</a>
</main>
</body>
</html>
