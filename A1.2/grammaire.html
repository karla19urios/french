<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammaire — Français A1.2</title>
<style>
  :root{
    --bleu:#002395;
    --blanc:#ffffff;
    --rouge:#ED2939;
    --bg:#f4f5f7;
    --card:#ffffff;
    --text:#1a1a2e;
    --muted:#6b7280;
    --border:#e5e7eb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141c;
      --card:#1b1e2b;
      --text:#f1f2f6;
      --muted:#9aa0b4;
      --border:#2a2e40;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header.flag{
    background:linear-gradient(90deg, var(--bleu) 33%, var(--blanc) 33%, var(--blanc) 66%, var(--rouge) 66%);
    height:8px;
    width:100%;
  }
  nav.tabs{
    display:flex;
    justify-content:center;
    gap:.5rem;
    flex-wrap:wrap;
    padding:1.2rem 1rem 0;
  }
  nav.tabs a{
    text-decoration:none;
    color:var(--muted);
    font-size:.88rem;
    font-weight:600;
    padding:.5rem 1rem;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    transition:all .12s ease;
  }
  nav.tabs a:hover{ border-color:var(--bleu); color:var(--bleu); }
  nav.tabs a.active{
    background:var(--bleu);
    border-color:var(--bleu);
    color:#fff;
  }
  .hero{
    padding:1.6rem 1.5rem 1.2rem;
    text-align:center;
  }
  .hero h1{
    margin:0 0 .3rem;
    font-size:1.7rem;
    letter-spacing:-0.02em;
  }
  .hero p{
    margin:0;
    color:var(--muted);
    font-size:.95rem;
  }
  main{
    max-width:1000px;
    margin:0 auto;
    padding:0 1.5rem 3rem;
  }
  .search{
    display:block;
    width:100%;
    max-width:420px;
    margin:0 auto 1.6rem;
    padding:.7rem 1rem;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:.95rem;
  }
  .sec-label{
    font-size:.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--bleu);
    margin:1.8rem 0 .8rem;
  }
  .sec-label:first-of-type{ margin-top:0; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:.8rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:1rem;
    display:flex;
    flex-direction:column;
    gap:.5rem;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,.08);
  }
  .card .num{
    font-size:.72rem;
    font-weight:700;
    color:var(--blanc);
    background:var(--bleu);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px;
    height:22px;
    border-radius:50%;
    flex-shrink:0;
  }
  .card .title-row{
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  .card .title{
    font-weight:600;
    font-size:.95rem;
    line-height:1.3;
  }
  .card a.link{
    text-decoration:none;
    color:var(--bleu);
    font-size:.85rem;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:.3rem;
  }
  .card a.link:hover{ text-decoration:underline; }
  .pill{
    align-self:flex-start;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
  }
  .empty-msg{
    text-align:center;
    color:var(--muted);
    padding:2rem;
    display:none;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
    padding:1.5rem;
  }
</style>
</head>
<body>
<header class="flag"></header>
<nav class="tabs">
  <a href="index.html">🏠 Accueil</a>
  <a href="grammaire.html" class="active">🧪 Grammaire</a>
  <a href="lectures.html">📖 Lectures</a>
  <a href="audios.html">🎧 Audios</a>
  <a href="video.html">🎬 Vidéo</a>
</nav>
<div class="hero">
  <h1>🧪 Laboratoire de grammaire</h1>
  <p>Leçons numérotées et fiches thématiques</p>
</div>

<main>
  <input class="search" id="search" type="text" placeholder="Rechercher une leçon ou une fiche...">

  <div class="sec-label">Leçons</div>
  <div class="grid" id="lecons"></div>

  <div class="sec-label">Fiches thématiques</div>
  <div class="grid" id="fiches"></div>

  <p class="empty-msg" id="empty">Aucun résultat.</p>
</main>

<footer><a href="index.html" style="color:inherit;">← Retour à l'accueil</a> &middot; <a href="../index.html" style="color:inherit;">Tous les niveaux</a></footer>

<script>
function enc(path){
  return path.split('/').map(encodeURIComponent).join('/');
}

const lecons = [
  ["14","La nourriture","Actividades A1.2/14_La nourriture (interactivo).html"],
  ["15","La routine quotidienne","Actividades A1.2/15_La routine quotidienne (interactivo).html"],
  ["16","L'heure en français","Actividades A1.2/16_L'Heure en français (interactivo).html"],
  ["17","Verbes avec -er","17_Verbes avec -er.pdf"],
  ["18","Dans ma maison il y a...","18_Dans ma maison il y a....pdf"],
  ["19","Les loisirs","19_les loisirs.pdf"],
  ["21","Les prépositions","21_les prépositions (3).pdf"],
  ["22","L'itinéraire","22_l_itinéraire.pdf"],
  ["23","Le corps humain","23_le corps humain.pdf"],
  ["24","Les vêtements","24_les vêtements (1).pdf"],
];

const fiches = [
  {title:"Il y a", path:"Grammaire A1.2/Il y a /index.html", type:"folder"},
  {title:"Pouvoir, devoir et vouloir", path:"Grammaire A1.2/Pouvoir, devoir et vouloir/index.html", type:"folder"},
  {title:"Quantités déterminées et indéterminées", path:"Grammaire A1.2/Quantités determinées et indeterminées/index.html", type:"folder"},
  {title:"Verbes -er", path:"Grammaire A1.2/Verbes -er/index.html", type:"folder"},
  {title:"Verbes pronominaux", path:"Grammaire A1.2/Verbes pronominaux/index.html", type:"folder"},
  {title:"Verbes au présent", path:"https://drive.google.com/open?id=1MKVnFQjt7Mqdg7lAOUj452EnOfO2yCF-", type:"external"},
  {title:"Les prépositions de lieu", path:"Grammaire A1.2/21_les prépositions de lieu.pdf", type:"pdf"},
  {title:"Le corps humain (fiche)", path:"Grammaire A1.2/23_le corps humain (2).pdf", type:"pdf"},
];

function pdfCard([num, title, path]){
  const isHtml = path.toLowerCase().endsWith('.html');
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.search = (num + ' ' + title).toLowerCase();
  div.innerHTML = `
    <div class="title-row">
      <span class="num">${num}</span>
      <span class="title">${title}</span>
    </div>
    <span class="pill">${isHtml ? 'Interactif' : 'PDF'}</span>
    <a class="link" href="${enc(path)}" ${isHtml ? '' : 'target="_blank"'}>${isHtml ? '🎮 Ouvrir l’activité' : '📄 Ouvrir le PDF'}</a>
  `;
  return div;
}

function ficheCard(item){
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.search = item.title.toLowerCase();
  let pill, label, href;
  if(item.type === 'folder'){
    pill = 'Images'; label = '🖼️ Voir les images'; href = enc(item.path);
  } else if(item.type === 'external'){
    pill = 'Google Drive'; label = '🔗 Ouvrir le lien'; href = item.path;
  } else {
    pill = 'PDF'; label = '📄 Ouvrir le PDF'; href = enc(item.path);
  }
  div.innerHTML = `
    <div class="title-row">
      <span class="title">${item.title}</span>
    </div>
    <span class="pill">${pill}</span>
    <a class="link" href="${href}" target="_blank">${label}</a>
  `;
  return div;
}

const lEl = document.getElementById('lecons');
lecons.forEach(item => lEl.appendChild(pdfCard(item)));

const fEl = document.getElementById('fiches');
fiches.forEach(item => fEl.appendChild(ficheCard(item)));

const searchInput = document.getElementById('search');
const emptyMsg = document.getElementById('empty');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.card').forEach(card => {
    const match = card.dataset.search.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });
  emptyMsg.style.display = (q !== '' && !anyVisible) ? 'block' : 'none';
});
</script>
</body>
</html>
