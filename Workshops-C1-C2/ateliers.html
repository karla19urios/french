<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ateliers — Workshops C1/C2</title>
<style>
  :root{
    --bleu:#393B66;
    --blanc:#ffffff;
    --rouge:#378EF6;
    --bg:#EAF2FE;
    --card:#ffffff;
    --text:#393B66;
    --muted:#646363;
    --border:#D5E3F8;
  }
  @media (prefers-color-scheme: dark){
    :root{--bleu:#378EF6;--rouge:#7DB6FA;
      --bg:#1D1F3A;
      --card:#2A2C50;
      --text:#F4F6FF;
      --muted:#B8B8B8;
      --border:#3F4278;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header.flag{
    background:linear-gradient(90deg, var(--bleu) 33%, var(--blanc) 33%, var(--blanc) 66%, var(--rouge) 66%);
    height:8px;
    width:100%;
  }
  nav.tabs{
    display:flex;
    justify-content:center;
    gap:.5rem;
    flex-wrap:wrap;
    padding:1.2rem 1rem 0;
  }
  nav.tabs a{
    text-decoration:none;
    color:var(--muted);
    font-size:.88rem;
    font-weight:600;
    padding:.5rem 1rem;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    transition:all .12s ease;
  }
  nav.tabs a:hover{ border-color:var(--bleu); color:var(--bleu); }
  nav.tabs a.active{
    background:var(--bleu);
    border-color:var(--bleu);
    color:#fff;
  }
  .hero{
    padding:1.6rem 1.5rem 1.2rem;
    text-align:center;
  }
  .hero h1{
    margin:0 0 .3rem;
    font-size:1.7rem;
    letter-spacing:-0.02em;
  }
  .hero p{
    margin:0;
    color:var(--muted);
    font-size:.95rem;
  }
  main{
    max-width:1000px;
    margin:0 auto;
    padding:0 1.5rem 3rem;
  }
  .search{
    display:block;
    width:100%;
    max-width:420px;
    margin:0 auto 1.6rem;
    padding:.7rem 1rem;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:.95rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:.8rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:1rem;
    display:flex;
    flex-direction:column;
    gap:.5rem;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,.08);
  }
  .card .num{
    font-size:.72rem;
    font-weight:700;
    color:var(--blanc);
    background:var(--bleu);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:1.7em;
    height:1.7em;
    padding:0 .35em;
    border-radius:999px;
    flex-shrink:0;
  }
  .card .title-row{
    display:flex;
    align-items:center;
    gap:.5rem;
  }
  .card .title{
    font-weight:600;
    font-size:.95rem;
    line-height:1.3;
  }
  .card a.link{
    text-decoration:none;
    color:var(--bleu);
    font-size:.85rem;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:.3rem;
  }
  .card a.link:hover{ text-decoration:underline; }
  .pill{
    align-self:flex-start;
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
  }
  .empty-msg{
    text-align:center;
    color:var(--muted);
    padding:2rem;
    display:none;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.8rem;
    padding:1.5rem;
  }
</style>

<body>

  <div style="width:100%;max-width:480px;padding:0 1.4rem;text-align:center;">
    <div style="height:8px;border-radius:8px;background:linear-gradient(90deg,#378EF6 33%,#ffffff 33%,#ffffff 66%,#393B66 66%);margin-bottom:2rem;"></div>
    <img src="../assets/persona/sourire_s.png" alt="Karla" style="width:168px;height:auto;margin:0 0 1.2rem;display:inline-block;filter:drop-shadow(0 16px 32px rgba(10,11,26,.6));">
    <h1 style="margin:0 0 .7rem;font-size:2.6rem;line-height:1.15;letter-spacing:-.01em;color:#F4F6FF;">&#127467;&#127479; Welcome to your French learning journey</h1>
    <p style="margin:0 0 1rem;color:#7DB6FA;font-size:1.15rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;">Accès réservé</p>
    <p style="margin:0 0 2.2rem;color:#B8B8B8;font-size:1.3rem;line-height:1.4;">Entre ton code et ton PIN pour accéder au site.</p>
    <input id="site-gate-code" type="text" placeholder="Code (ex. A1B2C3)" autocomplete="off" spellcheck="false" maxlength="6" style="width:100%;box-sizing:border-box;padding:1.1rem 1.2rem;margin-bottom:.9rem;border-radius:12px;border:1px solid #3F4278;background:#2A2C50;color:#F4F6FF;font-size:1.4rem;text-transform:uppercase;">
    <input id="site-gate-pin" type="text" inputmode="numeric" placeholder="PIN (4 chiffres)" autocomplete="off" maxlength="4" style="width:100%;box-sizing:border-box;padding:1.1rem 1.2rem;margin-bottom:1.3rem;border-radius:12px;border:1px solid #3F4278;background:#2A2C50;color:#F4F6FF;font-size:1.4rem;">
    <button id="site-gate-btn" type="button" style="width:100%;padding:1.15rem;border:none;border-radius:999px;background:#378EF6;color:#fff;font-weight:800;font-size:1.3rem;cursor:pointer;">Entrer</button>
    <p id="site-gate-err" style="display:none;margin:1rem 0 0;color:#ff8a94;font-size:1.05rem;text-align:center;">Code ou PIN incorrect.</p>
  </div>
</div>
<script>
(function(){
  var CODES = [["H4KTNR", "7392"], ["MX72QB", "4815"], ["P9RZKD", "2637"], ["T3NHXQ", "9184"], ["K6WYPZ", "5723"], ["D8MRTX", "3946"], ["Q2VNHB", "6258"], ["Z7XKPM", "8471"], ["R5TQWN", "2963"], ["B4HXZK", "7154"], ["N9QMRT", "3827"], ["W3ZKVH", "6492"], ["X8PNQD", "1758"], ["K5TRZM", "4926"], ["F3RGXK", "4521"], ["H7WQXB", "8317"], ["M2VNKT", "5749"], ["G8VNKR", "6284"], ["Q9ZRHX", "2681"], ["P7BMRZ", "7547"], ["V6XPTM", "3097"], ["T4KPMB", "9375"], ["D6XQNZ", "3164"], ["R8HWKT", "7852"], ["N3PZMQ", "4297"], ["K7VXRT", "6538"], ["Z2QHNB", "9146"], ["X5TMWK", "2879"], ["B9RNZQ", "5327"], ["K3WXNQ", "5716"], ["H3PKXT", "8654"], ["N4TVXK", "8420"], ["M8QWZH", "1739"], ["T6NRVK", "4285"], ["D9ZXHQ", "7913"], ["K4WMTB", "3568"], ["P7RNQZ", "9284"], ["X9HKVT", "6417"], ["Q3TZMB", "2795"], ["P4WKBG", "7254"], ["N7WPKR", "8462"], ["H2VXQT", "5931"], ["P2MZGZ", "5426"], ["Z6RNHK", "3748"], ["M9TXPQ", "6285"], ["K8ZWNR", "4172"], ["B5QHTX", "9536"], ["R3PVKZ", "1864"], ["T9NWMH", "7295"], ["X4RQBK", "3612"], ["H6ZTVN", "8457"], ["Q8MKRX", "2748"], ["D2WNHZ", "9163"], ["K9TXBQ", "5827"], ["N6RVMZ", "4739"], ["GSP1A6", "1402"], ["J51PHH", "6607"], ["7SVS5C", "3510"], ["F4DNJZ", "5082"], ["P9TXXP", "9537"], ["M4RNJG", "2407"], ["D6HWJM", "2630"]];
  var KEY = "frenchSiteAuth_v2";
  function ok(code, pin){
    for(var i=0;i<CODES.length;i++){ if(CODES[i][0]===code && CODES[i][1]===pin) return true; }
    return false;
  }
  function unlock(){
    var g = document.getElementById("site-gate-overlay");
    if(g) g.remove();
    document.documentElement.classList.add("site-gate-unlocked");
    document.documentElement.style.overflow = "";
  }
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch(e){}
  if(saved){
    var parts = saved.split("|");
    if(parts.length === 2 && ok(parts[0], parts[1])){
      unlock();
    }
  }
  if(document.getElementById("site-gate-overlay")){
    document.documentElement.style.overflow = "hidden";
    document.getElementById("site-gate-btn").addEventListener("click", function(){
      var code = document.getElementById("site-gate-code").value.trim().toUpperCase();
      var pin = document.getElementById("site-gate-pin").value.trim();
      if(ok(code, pin)){
        try{ sessionStorage.setItem(KEY, code + "|" + pin); }catch(e){}
        unlock();
      } else {
        document.getElementById("site-gate-err").style.display = "block";
      }
    });
    document.getElementById("site-gate-pin").addEventListener("keydown", function(e){
      if(e.key === "Enter") document.getElementById("site-gate-btn").click();
    });
    document.getElementById("site-gate-code").addEventListener("keydown", function(e){
      if(e.key === "Enter") document.getElementById("site-gate-pin").focus();
    });
  }

  function __gtCode(){
    try{
      var s = sessionStorage.getItem(KEY);
      if(!s) return null;
      var p = s.split("|");
      return (p.length===2 && ok(p[0], p[1])) ? p[0] : null;
    }catch(e){ return null; }
  }
  function __gtKey(){
    var p = location.pathname;
    try{ p = decodeURIComponent(p); }catch(e){}
    return p;
  }
  function __gtLoad(){
    var code = __gtCode();
    if(!code) return null;
    try{
      var raw = localStorage.getItem("progress_" + code);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function __gtSave(data){
    var code = __gtCode();
    if(!code) return;
    try{ localStorage.setItem("progress_" + code, JSON.stringify(data)); }catch(e){}
  }
  function __gtInit(){
    var total = document.querySelectorAll("[data-check]").length;
    if(total === 0) return;
    var data = __gtLoad();
    if(!data) return;
    var key = __gtKey();
    if(!data[key]) data[key] = {title: document.title, total: total, reviewed: {}, wrong: {}};
    data[key].title = document.title;
    data[key].total = total;
    __gtSave(data);
  }
  window.__gtMark = function(exerciseId, wrongList){
    var data = __gtLoad();
    if(!data) return;
    var key = __gtKey();
    if(!data[key]) data[key] = {title: document.title, total: document.querySelectorAll("[data-check]").length, reviewed: {}, wrong: {}};
    data[key].reviewed[exerciseId] = true;
    data[key].wrong[exerciseId] = wrongList || [];
    __gtSave(data);
  };
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", __gtInit);
  } else {
    __gtInit();
  }
})();
</script>

<script>
function enc(path){
  return path.split('/').map(encodeURIComponent).join('/');
}

const lecons = [
  ["01","Faire une synthèse écrite","Ateliers/01_Faire une synthèse écrite (interactivo).html"],

  ["02","Donner une opinion","Ateliers/02_Donner une opinion (interactivo).html"],

  ["03","Argumenter et convaincre","Ateliers/03_Argumenter et convaincre (interactivo).html"],

  ["04","Atelier de style","Ateliers/04_Atelier de style (interactivo).html"],

];

function pdfCard([num, title, path]){
  const ext = path.split('.').pop().toLowerCase();
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.search = (num + ' ' + title).toLowerCase();
  let pill, label;
  if(ext === 'html'){ pill = 'Interactif'; label = '🎮 Ouvrir l’activité'; }
  else if(ext === 'png' || ext === 'jpg' || ext === 'jpeg'){ pill = 'Image'; label = '🖼️ Voir l’image'; }
  else if(ext === 'mp3'){ pill = 'Audio'; label = '🎧 Écouter l’audio'; }
  else { pill = 'PDF'; label = '📄 Ouvrir le PDF'; }
  div.innerHTML = `
    <div class="title-row">
      <span class="num">${num}</span>
      <span class="title">${title}</span>
    </div>
    <span class="pill">${pill}</span>
    <a class="link" href="${enc(path)}" ${ext === 'html' ? '' : 'target="_blank"'}>${label}</a>
  `;
  return div;
}

const lEl = document.getElementById('lecons');
lecons.forEach(item => lEl.appendChild(pdfCard(item)));

const searchInput = document.getElementById('search');
const emptyMsg = document.getElementById('empty');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.card').forEach(card => {
    const match = card.dataset.search.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });
  emptyMsg.style.display = (q !== '' && !anyVisible) ? 'block' : 'none';
});
</script>
